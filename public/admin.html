<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Portal</title>
    <style>
      body { font-family: Arial, sans-serif; margin:0; padding:0; background:#f5f7fa; }
      .header { background:#111; color:#fff; padding:16px; text-align:left; font-weight:700; }
      .container { display:flex; height: calc(100vh - 0px); }
      .sidebar { width: 260px; background:#1f2a44; color:#fff; padding:16px; box-sizing:border-box; }
      .sidebar h3 { margin:0 0 12px 0; font-size:16px; }
      .sidebar ul { list-style:none; padding:0; margin:0; }
      .sidebar li { margin:8px 0; }
      .content { flex:1; padding:16px; overflow:auto; }
      .card { background:#fff; padding:16px; border-radius:8px; margin:12px 0; box-shadow:0 1px 2px rgba(0,0,0,.05); }
      table { width:100%; border-collapse: collapse; }
      th, td { border-bottom:1px solid #eee; padding:8px 6px; text-align:left; font-size:12px; }
    </style>
  </head>
  <body>
    <div class="header">管理后台</div>
    <div class="container">
      <div class="sidebar">
        <h3>导航</h3>
        <ul>
          <li>仪表盘</li>
          <li>古建管理</li>
          <li>用户管理</li>
          <li>打卡管理</li>
          <li>内容审核</li>
          <li>数据统计</li>
          <li>系统设置</li>
        </ul>
      </div>
      <div class="content">
        <div class="card">
          <h4>仪表盘</h4>
          <div id="dash" style="display:flex; gap:16px; flex-wrap:wrap;">
            <div class="stat" style="background:#fff; padding:12px; border-radius:6px; width:180px;">
              <div style="font-size:12px; color:#666;">总用户</div>
              <div style="font-size:22px; font-weight:700;">102</div>
            </div>
            <div class="stat" style="background:#fff; padding:12px; border-radius:6px; width:180px;">
              <div style="font-size:12px; color:#666;">古建总数</div>
              <div style="font-size:22px; font-weight:700;">58</div>
            </div>
            <div class="stat" style="background:#fff; padding:12px; border-radius:6px; width:180px;">
              <div style="font-size:12px; color:#666;">打卡总数</div>
              <div style="font-size:22px; font-weight:700;">340</div>
            </div>
            <div class="stat" style="background:#fff; padding:12px; border-radius:6px; width:180px;">
              <div style="font-size:12px; color:#666;">今日打卡</div>
              <div style="font-size:22px; font-weight:700;">12</div>
            </div>
          </div>
        </div>

        <div class="card">
          <h4>待审核内容</h4>
          <table>
            <thead><tr><th>标题</th><th>提交人</th><th>时间</th><th>状态</th></tr></thead>
            <tbody id="audit-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      // 简单示例数据
      const data = [
        { title: '打卡动态审核', user: '系统', time: '2026-05-01 10:00', status: '待审核' },
        { title: '用户上传照片审核', user: '管理员', time: '2026-05-01 11:00', status: '通过' }
      ];
      const tbody = document.getElementById('audit-body');
      data.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${r.title}</td><td>${r.user}</td><td>${r.time}</td><td>${r.status}</td>`;
        tbody.appendChild(tr);
      });
    </script>
  </body>
</html>
